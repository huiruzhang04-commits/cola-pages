<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="马里奥英语">

<style>
:root{--gold:#FFD700;--red:#E53935;--skin:#FFCCBC;--brown:#6D4C41;--blue:#1E88E5;--yellow:#FDD835;--white:#fff;--darkblue:#1565C0;--sky:#5c94fc;--grass:#4CAF50;--ground:#c84c09;--dark:#1a1a2e;--card:#FBF8F0;--green:#2E7D32}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:linear-gradient(135deg,#1a1a2e,#16213e);display:flex;justify-content:center;align-items:center;min-height:100vh;padding-bottom:80px;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:none;-webkit-user-select:none;user-select:none}
#container{position:relative;width:960px;height:540px}
canvas{display:block;border:3px solid #333;border-radius:8px;image-rendering:pixelated}
#ui-bar{position:absolute;top:0;left:0;right:0;padding:6px 16px;display:none;justify-content:space-between;align-items:center;background:rgba(26,26,46,0.9);border-radius:8px 8px 0 0;z-index:10;color:#fff;font-size:14px;font-weight:700}
#ui-bar.show{display:flex}
.ui-i{display:flex;align-items:center;gap:4px}.ui-i .val{color:var(--gold)}
#pause-btn{position:absolute;top:8px;right:8px;z-index:11;width:36px;height:36px;border-radius:50%;border:2px solid var(--gold);background:rgba(26,26,46,0.8);color:var(--gold);font-size:16px;cursor:pointer;display:none;align-items:center;justify-content:center}
#pause-btn.show{display:flex}
/* Word modal */
#word-modal{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;z-index:20;pointer-events:none}
#word-modal.active{pointer-events:auto}
#word-modal .card{width:380px;background:var(--card);border:3px solid #C4A35A;border-radius:16px;padding:28px 24px;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,0.5);display:none}
#word-modal.active .card{display:block;animation:popIn .3s ease-out}
@keyframes popIn{from{transform:scale(0.8);opacity:0}to{transform:scale(1);opacity:1}}
.card .icon{font-size:48px;line-height:1}.card .word-title{font-size:28px;font-weight:900;color:var(--dark);margin:8px 0;letter-spacing:2px}
.card .phonetic{font-size:14px;color:#888;margin-bottom:12px}
.card .sentence{font-size:18px;color:#555;margin-bottom:24px}.card .sentence b{color:var(--red);font-size:22px}
.card .options{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.card .opt{flex:1 1 40%;min-width:120px;padding:14px 8px;font-size:18px;font-weight:700;border:2px solid #C4A35A;border-radius:12px;background:#fff;color:var(--dark);cursor:pointer;transition:all .15s}
.card .opt:hover{background:#C4A35A;color:#fff}
.card .opt.correct{background:#4CAF50!important;color:#fff!important;border-color:#2E7D32!important}
.card .opt.wrong{background:#E53935!important;color:#fff!important;border-color:#B71C1C!important}
.card .opt:disabled{pointer-events:none}
.card .feedback{font-size:16px;margin-top:16px;min-height:24px;font-weight:700}
.replay-btn{width:36px;height:36px;border-radius:50%;border:2px solid #C4A35A;background:#fff;color:#C4A35A;font-size:16px;cursor:pointer;margin:4px auto;display:block;transition:all .15s}.replay-btn:hover{background:#C4A35A;color:#fff}.replay-btn.dark{border-color:var(--gold);background:transparent;color:var(--gold)}.replay-btn.dark:hover{background:var(--gold);color:var(--dark)}
/* Boss modal */
#boss-modal{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;z-index:20;pointer-events:none}
#boss-modal.active{pointer-events:auto}
#boss-modal .boss-card{width:440px;background:linear-gradient(135deg,#1a1a2e,#16213e);border:3px solid #E53935;border-radius:16px;padding:28px 24px;text-align:center;box-shadow:0 8px 48px rgba(229,57,53,0.3);display:none;color:#fff}
#boss-modal.active .boss-card{display:block;animation:popIn .3s ease-out}
.boss-card .boss-icon{font-size:56px}.boss-card .boss-title{font-size:22px;font-weight:900;color:#E53935;margin:8px 0}
.boss-card .boss-sentence{font-size:20px;color:#E0D5B8;margin-bottom:20px}
.boss-card .boss-sentence b{color:var(--gold);font-size:24px}
.boss-card .boss-hint{display:flex;justify-content:center;gap:20px;margin-bottom:16px;font-size:28px}
.boss-card .boss-options{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.boss-card .boss-opt{flex:1 1 40%;min-width:130px;padding:14px 8px;font-size:18px;font-weight:700;border:2px solid var(--gold);border-radius:12px;background:transparent;color:var(--gold);cursor:pointer;transition:all .15s}
.boss-card .boss-opt:hover{background:var(--gold);color:var(--dark)}
.boss-card .boss-opt.b-correct{background:#4CAF50!important;color:#fff!important;border-color:#2E7D32!important}
.boss-card .boss-opt.b-wrong{background:#E53935!important;color:#fff!important;border-color:#B71C1C!important}
.boss-card .boss-opt:disabled{pointer-events:none}
.boss-card .boss-fb{font-size:16px;margin-top:16px;min-height:24px;font-weight:700}
/* Pause overlay */
#pause-overlay{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(10,10,30,0.9);display:none;align-items:center;justify-content:center;z-index:25;flex-direction:column;color:#fff;gap:20px}
#pause-overlay.show{display:flex}
#pause-overlay h2{font-size:36px;color:var(--gold)}
#pause-overlay button{padding:14px 40px;font-size:20px;font-weight:700;border:2px solid var(--gold);border-radius:12px;background:transparent;color:var(--gold);cursor:pointer;min-width:220px}
#pause-overlay button:hover{background:var(--gold);color:var(--dark)}
/* Word book */
#wordbook{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(10,10,30,0.95);display:none;align-items:center;justify-content:center;z-index:25;flex-direction:column;color:#fff;overflow-y:auto;padding:20px}
#wordbook.show{display:flex}
#wordbook h2{font-size:28px;color:var(--gold);margin-bottom:16px}
#wordbook .wb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;width:100%;max-width:880px}
#wordbook .wb-word{padding:10px;border:2px solid #444;border-radius:10px;text-align:center;background:rgba(255,255,255,0.05);color:#ccc;font-size:15px}
#wordbook .wb-word.learned{border-color:var(--gold);background:rgba(255,215,0,0.1);color:#fff}
#wordbook .wb-icon{font-size:24px}#wordbook .wb-en{font-weight:700;font-size:17px}#wordbook .wb-zh{font-size:13px;color:#aaa}
#wordbook .wb-back{margin-top:20px;padding:12px 36px;font-size:18px;font-weight:700;border:2px solid var(--gold);border-radius:12px;background:transparent;color:var(--gold);cursor:pointer}
/* Joystick */
#joystick-zone{display:none;position:absolute;left:clamp(12px,3vw,32px);bottom:clamp(12px,3vw,32px);z-index:15}
#joy-base{width:clamp(80px,22vw,110px);height:clamp(80px,22vw,110px);border-radius:50%;border:3px solid rgba(255,215,0,0.2);background:rgba(255,215,0,0.03);position:relative;touch-action:none}
#joy-stick{width:42%;height:42%;border-radius:50%;background:rgba(255,215,0,0.45);border:2px solid var(--gold);position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;transition:transform .05s linear}
#joy-jump{width:clamp(44px,13vw,56px);height:clamp(44px,13vw,56px);border-radius:50%;border:2px solid var(--gold);background:rgba(26,26,46,0.7);color:var(--gold);font-size:clamp(18px,4.5vw,24px);position:absolute;right:clamp(10px,2.5vw,28px);bottom:clamp(24px,7vw,50px);display:none;align-items:center;justify-content:center;cursor:pointer;z-index:15;touch-action:none;-webkit-tap-highlight-color:transparent}
@media(max-width:980px){#joystick-zone,#joy-jump{display:block}
/* Overlays: fixed to viewport so cards don't clip inside tiny container */
#word-modal,#boss-modal,#pause-overlay,#wordbook{position:fixed;top:0;left:0;right:0;bottom:0}
/* Word card */#word-modal .card{width:min(86vw,360px);padding:clamp(8px,2.2vw,20px) clamp(8px,2vw,20px);overflow-y:auto;max-height:75vh}
.card .icon{font-size:clamp(22px,6vw,40px)}.card .word-title{font-size:clamp(14px,4vw,24px)}
.card .phonetic{font-size:clamp(9px,2vw,13px)}
.card .sentence{font-size:clamp(12px,3vw,16px)}.card .sentence b{font-size:clamp(13px,3.2vw,18px)}
.card .opt{font-size:clamp(12px,2.8vw,16px);padding:clamp(6px,1.5vw,10px) 6px;flex:1 1 auto;min-width:0}
.card .feedback{font-size:clamp(10px,2vw,14px);margin-top:6px}
.replay-btn{width:clamp(24px,5vw,30px);height:clamp(24px,5vw,30px);font-size:clamp(10px,2.5vw,14px)}
/* Boss card */#boss-modal .boss-card{width:min(90vw,420px);padding:clamp(8px,2.2vw,20px) clamp(8px,2vw,20px);overflow-y:auto;max-height:75vh}
.boss-card .boss-icon{font-size:clamp(24px,6vw,48px)}.boss-card .boss-title{font-size:clamp(13px,3.5vw,20px)}
.boss-card .boss-hint{font-size:clamp(16px,4vw,24px);gap:clamp(4px,1.5vw,16px)}
.boss-card .boss-sentence{font-size:clamp(12px,3vw,18px)}.boss-card .boss-sentence b{font-size:clamp(13px,3.2vw,20px)}
.boss-card .boss-opt{font-size:clamp(11px,2.5vw,16px);padding:clamp(6px,1.5vw,10px) 6px;flex:1 1 auto;min-width:0}
.boss-card .boss-fb{font-size:clamp(10px,2vw,14px);margin-top:6px}
/* Pause */#pause-overlay{gap:clamp(12px,3vw,20px)}#pause-overlay h2{font-size:clamp(20px,5vw,36px)}#pause-overlay button{font-size:clamp(14px,3vw,20px);padding:clamp(10px,2vw,14px) clamp(24px,6vw,40px);min-width:clamp(140px,38vw,220px)}
/* Wordbook */#wordbook h2{font-size:clamp(18px,4vw,28px)}#wordbook .wb-grid{grid-template-columns:repeat(auto-fill,minmax(85px,1fr));gap:6px}
#wordbook .wb-word{padding:6px;font-size:clamp(11px,2.2vw,15px)}#wordbook .wb-icon{font-size:clamp(16px,4vw,24px)}
#wordbook .wb-en{font-size:clamp(12px,2.5vw,17px)}#wordbook .wb-zh{font-size:clamp(10px,2vw,13px)}
#wordbook .wb-back{font-size:clamp(13px,3vw,18px);padding:clamp(8px,2vw,12px) clamp(24px,6vw,36px)}
/* UI bar */#ui-bar{font-size:clamp(10px,2vw,14px);padding:4px 10px}
#pause-btn{width:clamp(28px,5vw,36px);height:clamp(28px,5vw,36px);font-size:clamp(12px,2.5vw,16px)}
/* Touch controls */}}
</style>
</head>
<body>
<div id="container">
<canvas id="c"></canvas>
<div id="ui-bar"><div class="ui-i"><span>🪙</span><span class="val" id="coin-display">0</span></div><div class="ui-i"><span>📖</span><span class="val" id="level-display">L1</span></div><div class="ui-i"><span>⏱</span><span class="val" id="time-display">0:00</span></div><div class="ui-i"><span>❤️</span><span id="lives-display"></span></div></div>

<div id="pause-overlay"><h2>⏸ 暂停</h2><button onclick="togglePause()">▶ 继续</button><button onclick="resetLevel()">🔄 重新开始</button><button onclick="goToMenu()">🏠 返回主菜单</button></div>
<div id="wordbook"><h2>📖 单词库</h2><div class="wb-grid" id="wb-grid"></div><button class="wb-back" onclick="closeWordbook()">← 返回</button></div>
<div id="joystick-zone"><div id="joy-base"><div id="joy-stick"></div></div></div>
<button id="joy-jump">▲</button>
</div>

const synth=window.speechSynthesis;let soundOn=true;
function speak(text,rate=0.7){
  if(!soundOn||!synth)return;synth.cancel();
  const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=rate;u.pitch=1.1;synth.speak(u);
}

    if(wl===14){ctx.fillStyle='#FF7043';for(let i=0;i<5;i++){const cx=((i*350+180)-camera*0.3)%(W+400)-180;ctx.beginPath();ctx.ellipse(cx,GROUND-8,20+i*3,12+i*2,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#E64A19';ctx.beginPath();ctx.ellipse(cx-6,GROUND-18,5,10,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#FF7043';}}
  }else if(w===4){
    // 天空之城：浅蓝天空+大云，L20远处城堡
    const w4l=curLevel?curLevel.level:17;
    g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#E3F2FD');g.addColorStop(0.3,'#BBDEFB');g.addColorStop(0.8,'#90CAF9');g.addColorStop(1,'#CFD8DC');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    ctx.fillStyle='rgba(255,255,255,0.9)';
    for(let i=0;i<4;i++){const cx=((i*500+100)-camera*0.2)%(W+500)-300;
      const cy=50+i*70;ctx.fillRect(cx,cy,140,50);ctx.fillRect(cx+30,cy-25,80,35);ctx.fillRect(cx+10,cy+20,60,18);
    }
    ctx.fillStyle='rgba(255,255,255,0.6)';for(let i=0;i<6;i++){const cx=((i*300+200)-camera*0.3)%(W+400)-150;ctx.fillRect(cx,30+i*60,80,28);ctx.fillRect(cx+15,18+i*60,50,18);}
    // L20城堡轮廓
    if(w4l>=20){ctx.fillStyle='rgba(100,80,120,0.4)';const cfx=levelData?levelData.w-200-camera*0.05:700;ctx.fillRect(cfx,GROUND-150,80,150);ctx.fillRect(cfx+80,GROUND-120,60,120);ctx.fillRect(cfx+90,GROUND-170,40,80);ctx.fillStyle='rgba(150,130,170,0.25)';ctx.fillRect(cfx+10,GROUND-140,25,30);ctx.fillRect(cfx+50,GROUND-130,20,20);}
  }else if(w===5){
    // 库巴城堡：暗红天空+岩浆
    g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1a0a0a');g.addColorStop(0.4,'#2d0a0a');g.addColorStop(0.7,'#4a1010');g.addColorStop(1,'#3d1b0e');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    // 城堡轮廓
    ctx.fillStyle='#1a0a10';for(let i=0;i<3;i++){const bx=((i*600)-camera*0.1)%(W+600)-200;ctx.fillRect(bx,GROUND-200-i*30,120,200+i*30);ctx.fillRect(bx+120,GROUND-180-i*30,80,180+i*30);ctx.fillRect(bx+130,GROUND-230-i*30,60,80+i*30);}
    // 岩浆河(远处)
    ctx.fillStyle='#FF5722';for(let i=0;i<8;i++){const lx=((i*180)-camera*0.3)%(W+300)-100;ctx.fillRect(lx,GROUND+8,60+Math.sin(i*3)*10,6);}
  }else{
    // 世界1 草地王国：蓝天白云绿山
    g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#87CEEB');g.addColorStop(0.6,'#5c94fc');g.addColorStop(1,'#4a7de0');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

function spawnParticles(x,y,color,n){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-0.5)*5,vy:(Math.random()-0.5)*5-3,life:20+Math.random()*15,color});}

// ===== PHYSICS =====
const GRAVITY=0.55,SPEED=3.5,JUMP=-10.5;
function collides(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}

function updatePhysics(){
  if(paused||scene!=='playing')return;
  const w=curLevel?curLevel.world:1;
  const grav=w===3?0.28:GRAVITY;const spd=w===3?3.0:SPEED;const jmp=w===3?(-12.5):JUMP;
  if(keys['ArrowLeft']||keys['a']){player.vx=-spd;player.facing=-1;}
  else if(keys['ArrowRight']||keys['d']){player.vx=spd;player.facing=1;}
  else player.vx*=0.7;
  if(Math.abs(player.vx)<0.1)player.vx=0;
  if((keys[' ']||keys['ArrowUp']||keys['w'])&&player.onGround){player.vy=jmp;player.onGround=false;}
  player.vy+=grav;player.x+=player.vx;player.y+=player.vy;

  player.onGround=false;
  const pb=player.big?{x:player.x,y:player.y,w:48,h:72}:{x:player.x,y:player.y,w:player.w,h:player.h};
  levelData.platforms.forEach(p=>{
    let px=p.x,py=p.y;if(p.type==='move'){px=p.x;py=p.y;}
    if(!collides(pb,{x:px,y:py,w:p.w,h:p.h}))return;
    const ot=pb.y+pb.h-py,ob=py+p.h-pb.y,ol=pb.x+pb.w-px,orr=px+p.w-pb.x;
    const mo=Math.min(ot,ob,ol,orr);
    if(mo===ot&&player.vy>=0){player.y=py-(player.big?72:48);player.vy=0;player.onGround=true;if(p.type==='move')player.x+=p.moveSpeed||0;}
    else if(mo===ol&&player.vx>0)player.x=px-(player.big?48:32);
    else if(mo===orr&&player.vx<0)player.x=px+p.w;
  });
  if(player.y+(player.big?72:48)>=GROUND){player.y=GROUND-(player.big?72:48);player.vy=0;player.onGround=true;}
  if(player.y>GROUND+200)die();

  // Moving platforms
  (levelData.movePlatforms||[]).forEach(p=>{p.x+=p.moveSpeed;if(Math.abs(p.x-p.startX)>p.range)p.moveSpeed*=-1;});

  camera+=(player.x-camera-W*0.35)*0.08;if(camera<0)camera=0;if(camera>levelData.w-W)camera=levelData.w-W;

  // Boss trigger
  if(levelData.hasBoss&&!bossPhase&&player.x>levelData.w-300)activateBoss();

  // Enemies
  enemies.forEach(e=>{
    if(e.y>GROUND+50)return;if(e.type==='shell')return;
    if(e.type==='jellyfish'){e.y=e.baseY+Math.sin(frame*0.03+e.phase)*40;}
    else if(e.type==='pufferfish'){e.puffTimer++;e.isPuffed=(e.puffTimer%120)>70;e.x+=e.vx;if(Math.abs(e.x-e.sx)>e.range)e.vx*=-1;}
    else{e.x+=e.vx;if(Math.abs(e.x-e.sx)>e.range)e.vx*=-1;}
    const el={x:e.x+2,y:e.y+2,w:e.w-4,h:e.h-4};
    if(!collides(pb,el))return;
    if(player.vy>0&&pb.y+pb.h-el.y<18){
      if(e.type==='jellyfish'||(e.type==='pufferfish'&&e.isPuffed)){die();return;}
      else if(e.type==='koopa'){e.type='shell';e.h=16;e.y+=12;e.vx=0;spawnParticles(e.x+14,e.y,'#FFD700',8);coins+=3;}
      else{e.y=GROUND+100;coins+=3;spawnParticles(e.x+14,e.y+14,'#FFD700',10);}
      player.vy=-5;
    }else if(invincible>0){e.y=GROUND+100;coins+=5;}
    else die();
  });

  // Shell
  if(shell&&shell.active){shell.x+=shell.vx;enemies.forEach(e=>{if(e.y<GROUND+50&&collides(shell,{x:e.x+2,y:e.y+2,w:e.w-4,h:e.h-4})){e.y=GROUND+100;coins+=5;spawnParticles(e.x+14,e.y+14,'#FFD700',8);}});if(shell.vx!==0&&Math.abs(shell.x-shell.startX)>600){shell.active=false;shell=null;}}
  if(shell&&shell.vx===0&&collides(pb,shell)){shell.vx=(player.x>shell.x)?8:-8;shell.active=true;}

  // Coins
  levelData.coins.forEach(c=>{if(!c.collected&&Math.abs(player.x+16-c.x)<18&&Math.abs(player.y+24-c.y)<20){c.collected=true;coins++;spawnParticles(c.x,c.y,'#FFD700',4);}});

  // Hit items
  hitItems.forEach(h=>{if(!h.hit&&!h.active&&Math.abs(player.x+16-h.x)<20&&Math.abs(player.y-h.y)<20&&player.vy<0){h.active=true;h.hit=true;if(h.item==='coin')coins+=3;else if(h.item==='mushroom'&&!player.big){player.big=true;player.y-=24;}else if(h.item==='star')invincible=300;spawnParticles(h.x,h.y-10,'#FFD700',8);}});

  // Quiz triggers
  levelData.quizzes.forEach((q,i)=>{if(!triggeredQuiz.includes(i)&&Math.abs(player.x-q.x)<40){triggeredQuiz.push(i);quizIdx=i;if(levelData.hasBoss&&i>=levelData.quizzes.length-1)activateBoss();else showWordCard();}});

  if(invincible>0)invincible--;
  if(bossRetreat>0)bossRetreat--;
  particles=particles.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.15;p.life--;return p.life>0;});
}

function die(){
  if(scene==='dead')return;lives--;spawnParticles(player.x+16,player.y+24,'#E53935',15);
  if(lives<=0){scene='dead';updateUI();return;}
  player.x=Math.max(80,camera+50);player.y=GROUND-48;player.vx=0;player.vy=0;player.big=false;invincible=120;updateUI();
}

function activateBoss(){if(bossPhase)return;bossPhase=true;bossQIdx=0;bossCorrect=0;showBossQuestion();}

// ===== LEVEL SETUP (procedural) =====
function generateLevelData(world, level, words, hasBoss) {
  const numWords = words.length;
  const lw = 2400 + numWords * 150;
  const spacing = lw / (numWords + 2);

  // Ground
  const platforms = [{x:0, y:GROUND, w:lw, h:120, type:'ground'}];

  // Bricks spaced across level
  for (let i = 0; i < numWords + 2; i++) {
    const items = ['coin','mushroom','star','coin','coin'];
    platforms.push({x: 200 + spacing * i, y: 320 + (i%3)*40, w:64, h:32, type:'brick', item: items[i%items.length]});
  }

  // Pipes
  platforms.push({x: lw*0.25, y:360, w:64, h:60, type:'pipe'});
  platforms.push({x: lw*0.65, y:360, w:64, h:60, type:'pipe'});

  // Quiz triggers
  const quizzes = words.map((_, i) => ({x: spacing * (i + 1) + 100}));

  // Coins
  const coins = [];
  for (let i = 0; i < 60 + numWords * 5; i++) {
    coins.push({x: 100 + i * (lw/70), y: GROUND - 60 - (i%4)*35, collected:false});
  }

  // Enemies
  const enemies = [];
  for (let i = 0; i < numWords + 3; i++) {
    const ex = 300 + spacing * i * 0.8;let type;
    if(world===3){type=i%3===0?'jellyfish':i%3===1?'pufferfish':'goomba';}
    else if(world>=2&&i%3===0)type='koopa';
    else type='goomba';
    const ee={x:ex, y:GROUND-28, w:28, h:28, vx:-1 - Math.random()*0.5, sx:ex, range:100+Math.floor(Math.random()*100), type};
    if(type==='jellyfish'){ee.baseY=ee.y;ee.phase=Math.random()*Math.PI*2;ee.vx=0;}
    if(type==='pufferfish'){ee.puffTimer=Math.floor(Math.random()*90);ee.isPuffed=false;}
    enemies.push(ee);
  }

  // Moving platforms for worlds 2+
  const movePlatforms = world >= 2 ? [
    {x: lw*0.4, y:300, w:80, h:20, type:'move', moveSpeed:1.2, startX: lw*0.4, range:80},
    {x: lw*0.7, y:260, w:80, h:20, type:'move', moveSpeed:1.5, startX: lw*0.7, range:100},
  ] : [];

  return {w:lw, hasBoss, platforms, quizzes, coins, enemies, movePlatforms, world, worldName: ['','🌿 草地王国','🕳️ 洞穴王国','🐠 海底王国','☁️ 天空之城','🏰 库巴城堡'][world]};
}

function initLevel(world, level){
  const key = world+'-'+level;
  const words = ALL_WORDS[key];
  if (!words) return;
  const hasBoss = level > 1;const maxBoss=(level===26)?5:3;
  curLevel = {world, level};
  levelData = generateLevelData(world, level, words, hasBoss);
  player = {x:80, y:GROUND-48, w:32, h:48, vx:0, vy:0, onGround:false, facing:1, big:false};
  camera = 0; coins = 0; lives = 3; time = 0; frame = 0; quizIdx = 0; quizAnswered = 0; quizCorrect = 0;
  triggeredQuiz = []; particles = []; invincible = 0; bossPhase = false; bossQIdx = 0; bossCorrect = 0; bossRetreat = 0; shell = null; paused = false;
  enemies = levelData.enemies.map(e => ({...e}));
  hitItems = levelData.platforms.filter(p => p.item).map(p => ({x:p.x+20, y:p.y+50, item:p.item, active:false, hit:false}));
  scene = 'playing';
  document.getElementById('ui-bar').classList.add('show');
  document.getElementById('pause-btn').classList.add('show');
  document.getElementById('pause-overlay').classList.remove('show');
  updateUI();
}

function resetLevel(){initLevel(curLevel.world,curLevel.level);}

function goToMenu(){paused=false;scene='menu';document.getElementById('ui-bar').classList.remove('show');document.getElementById('pause-btn').classList.remove('show');document.getElementById('pause-overlay').classList.remove('show');document.getElementById('word-modal').classList.remove('active');document.getElementById('boss-modal').classList.remove('active');}

  function drawWorlds(){

    const worlds=[
      {n:'🌿 世界1 · 草地王国',sub:'Aa-Ee · 21词 · L1-L5',w:1},
      {n:'🕳️ 世界2 · 洞穴王国',sub:'Ff-Jj · 20词 · L6-L10',w:2},
      {n:'🐠 世界3 · 海底王国',sub:'Kk-Pp · 24词 · L11-L16',w:3},
      {n:'☁️ 世界4 · 天空之城',sub:'Qq-Uu · 18词 · L17-L21',w:4},
      {n:'🏰 世界5 · 库巴城堡',sub:'Vv-Zz · 16词 · L22-L26',w:5},
    ];
    worldBtns=[];
    worlds.forEach((w,i)=>{
      const btnW=600,btnH=66,bx=W/2-btnW/2,by=120+i*80;
      const unlocked=true;
      const hover=mx>bx&&mx<bx+btnW&&my>by&&my<by+btnH;
      ctx.fillStyle=hover?'rgba(255,215,0,0.3)':'rgba(255,255,255,0.08)';
      ctx.fillRect(bx,by,btnW,btnH);
      ctx.strokeStyle='#FFD700';ctx.lineWidth=2;ctx.strokeRect(bx,by,btnW,btnH);
      ctx.fillStyle='#FFD700';ctx.font='bold 22px "PingFang SC","Microsoft YaHei",sans-serif';ctx.textAlign='left';
      ctx.fillText(w.n,bx+20,by+28);
      ctx.fillStyle='#888';ctx.font='14px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillText(w.sub,bx+20,by+52);
      worldBtns.push({bx,by,btnW,btnH,w:w.w});
    });
    ctx.textAlign='center';ctx.fillStyle='#888';ctx.font='14px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillText('← 点击返回主菜单',W/2,530);
    menuBack=true;
  }

  function drawLevels(){
    ctx.fillStyle='#1a1a2e';ctx.fillRect(0,0,W,H);
    const worldNames=['','🌿 草地王国','🕳️ 洞穴王国','🐠 海底王国','☁️ 天空之城','🏰 库巴城堡'];
    const worldRanges=[[],[1,5],[6,10],[11,16],[17,21],[22,26]];
    const [startL,endL]=worldRanges[selWorld]||[1,5];
    ctx.fillStyle='#FFD700';ctx.font='bold 28px "Courier New",monospace';ctx.textAlign='center';
    ctx.fillText(worldNames[selWorld]+' · 选择关卡',W/2,70);
    const levels=[];
    for(let l=startL;l<=endL;l++){
      const key=selWorld+'-'+l;
      const words=ALL_WORDS[key]||[];
      const wordList=words.map(w=>w.icon+' '+w.w).join(' · ');
      const nWords=words.length;
      const isBoss=l>1;
      levels.push({n:'L'+l,words:wordList,sub:nWords+'词 · '+(isBoss?'库巴Boss战':'')});
    }
    levelBtns=[];
    levels.forEach((lv,i)=>{
      const btnW=620,btnH=Math.min(70,Math.floor((H-140)/levels.length)),bx=W/2-btnW/2,by=110+i*82;
      const hover=mx>bx&&mx<bx+btnW&&my>by&&my<by+btnH;
      ctx.fillStyle=hover?'rgba(255,215,0,0.3)':'rgba(255,255,255,0.08)';
      ctx.fillRect(bx,by,btnW,btnH);
      ctx.strokeStyle='#FFD700';ctx.lineWidth=2;ctx.strokeRect(bx,by,btnW,btnH);
      ctx.fillStyle='#FFD700';ctx.font='bold 20px "PingFang SC","Microsoft YaHei",sans-serif';ctx.textAlign='left';
      ctx.fillText(lv.n,bx+20,by+28);
      ctx.fillStyle='#ccc';ctx.font='15px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillText(lv.words,bx+20,by+50);
      levelBtns.push({bx,by,btnW,btnH,l:startL+i});
    });
    ctx.textAlign='center';ctx.fillStyle='#888';ctx.font='14px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.fillText('← 点击返回选择世界',W/2,530);
    menuBack=true;
  }

  function drawGame(){
    ctx.save();drawBg();ctx.translate(-Math.floor(camera),0);
    const w=levelData.world||1;
    const gc={1:['#c84c09','#8BCE63'],2:['#3d2b1e','#5D4037'],3:['#F9A825','#FBC02D'],4:['#B0BEC5','#CFD8DC'],5:['#2d1b0e','#4a1a1a']}[w]||['#c84c09','#8BCE63'];
    ctx.fillStyle=gc[0];ctx.fillRect(0,GROUND,levelData.w,120);ctx.fillStyle=gc[1];ctx.fillRect(0,GROUND,levelData.w,16);
    levelData.platforms.forEach(p=>{if(p.type==='brick')drawBrick(p.x,p.y,p.item);else if(p.type==='pipe')drawPipe(p.x,p.y);else if(p.type==='move'){ctx.fillStyle='#6D4C41';ctx.fillRect(p.x,p.y,p.w,p.h);ctx.fillStyle='#A0782C';ctx.fillRect(p.x+2,p.y+2,p.w-4,4);}});
    levelData.coins.forEach(c=>{if(c.collected)return;const g=Math.sin(frame*0.08)*0.3+0.7;ctx.fillStyle=`rgba(255,215,0,${g})`;ctx.fillRect(c.x-6,c.y-6,12,12);ctx.fillStyle='#FFD700';ctx.fillRect(c.x-4,c.y-4,8,8);});
    enemies.forEach(e=>{if(e.y>GROUND+50)return;if(e.type==='shell')drawShell(e);else if(e.type==='koopa')drawKoopa(e);else if(e.type==='jellyfish')drawJellyfish(e);else if(e.type==='pufferfish')drawPufferfish(e);else drawGoomba(e);});
    if(shell&&shell.active)drawShell(shell);
    if(bossPhase){
      const bx=levelData.w-120-(bossCorrect*25)+Math.max(0,bossRetreat*0.6);
      drawBoss(bx,GROUND-140-(bossRetreat*0.3));
      const maxBc=(curLevel.world===5&&curLevel.level===26)?5:3;if(bossCorrect>=maxBc&&frame%5===0)for(let i=0;i<3;i++)spawnParticles(levelData.w-100+Math.random()*60,GROUND-200+Math.random()*40,'#FFD700',4);
    }
    if(invincible>0&&scene==='playing'){ctx.fillStyle=invincible%10<5?'#FFD700':'#fff';ctx.font='18px serif';ctx.textAlign='center';for(let i=0;i<3;i++)ctx.fillText('✦',player.x+16+(i-1)*12,player.y-8);}
    if(!(invincible>0&&invincible%6<3))drawPixelChar(player.x,player.y,player.facing,player.big);
    particles.forEach(p=>{ctx.globalAlpha=p.life/35;ctx.fillStyle=p.color;ctx.fillRect(p.x-2,p.y-2,4,4);});ctx.globalAlpha=1;
    ctx.restore();

    if(scene==='dead'){
      ctx.fillStyle='rgba(20,5,5,0.8)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#E53935';ctx.font='bold 36px "Courier New",monospace';ctx.textAlign='center';
      ctx.fillText('GAME OVER',W/2,240);ctx.font='20px "PingFang SC","Microsoft YaHei",sans-serif';ctx.fillStyle='#E0D5B8';ctx.fillText('按空格键重新开始',W/2,300);
    }
    if(scene==='win'){
      ctx.fillStyle='rgba(10,10,30,0.85)';ctx.fillRect(0,0,W,H);
      ctx.font='bold 36px "Courier New",monospace';ctx.textAlign='center';
      const isBossWin=levelData.hasBoss&&bossCorrect>=(curLevel.world===5&&curLevel.level===26?5:3);
      const wn=isBossWin?'🎉 库巴被打败了！':('🎉 第'+curLevel.level+'关通过！');
      ctx.fillStyle='#FFD700';ctx.fillText(wn,W/2,180);
      ctx.fillStyle='#E0D5B8';ctx.font='20px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.fillText('答对 '+quizCorrect+'/'+ALL_WORDS[curLevel.world+'-'+curLevel.level].length+' 单词 · ⭐ '+coins+' 金币 · ⏱ '+Math.floor(time/60)+':'+String(Math.floor(time%60)).padStart(2,'0'),W/2,240);
      if(levelData.hasBoss)ctx.fillText('Boss战答对 '+bossCorrect+'/'+(curLevel.world===5&&curLevel.level===26?5:3),W/2,275);
      const btns=[{y:340,t:'🔄 重玩本关'},{y:400,t:'▶ 下一关'},{y:460,t:'🏠 返回主菜单'}];
      winBtns=btns;
      btns.forEach((b,i)=>{
        const btnW=260,btnH=44,bx=W/2-btnW/2,by=b.y;
        const hover=mx>bx&&mx<bx+btnW&&my>by&&my<by+btnH;
        ctx.fillStyle=hover?'#FFD700':'rgba(255,215,0,0.2)';ctx.fillRect(bx,by,btnW,btnH);
        ctx.strokeStyle='#FFD700';ctx.lineWidth=2;ctx.strokeRect(bx,by,btnW,btnH);
        ctx.fillStyle=hover?'#1a1a2e':'#FFD700';ctx.font='bold 18px "PingFang SC","Microsoft YaHei",sans-serif';
        ctx.fillText(b.t,W/2,by+30);
      });
    }
  }
}

let menuBtns=[],worldBtns=[],levelBtns=[],winBtns=[],menuBack=false,selWorld=1,mx=0,my=0;

canvas.addEventListener('click',e=>{
  const rect=canvas.getBoundingClientRect();
  mx=(e.clientX-rect.left)*(W/rect.width);my=(e.clientY-rect.top)*(H/rect.height);
  if(scene==='menu'){
    menuBtns.forEach(b=>{const bx=W/2-140;if(mx>bx&&mx<bx+280&&my>b.y&&my<b.y+48)b.action();});
  }else if(scene==='worlds'){
    if(menuBack&&my>510&&my<540)scene='menu';
    worldBtns.forEach(b=>{if(mx>b.bx&&mx<b.bx+b.btnW&&my>b.by&&my<b.by+b.btnH){selWorld=b.w;scene='levels';}});
  }else if(scene==='levels'){
    if(menuBack&&my>510&&my<540)scene='worlds';
    levelBtns.forEach(b=>{if(mx>b.bx&&mx<b.bx+b.btnW&&my>b.by&&my<b.by+b.btnH)initLevel(Number(selWorld),b.l);});
  }else if(scene==='win'){
    winBtns.forEach((b,i)=>{const bx=W/2-130;if(mx>bx&&mx<bx+260&&my>b.y&&my<b.y+44){
      if(i===0)resetLevel();
      else if(i===1){const nk=curLevel.world+'-'+(curLevel.level+1);if(ALL_WORDS[nk])initLevel(curLevel.world,curLevel.level+1);else goToMenu();}
      else goToMenu();
    }});
  }else if(scene==='dead'){
    resetLevel();
  }
});

// ===== WORD BOOK =====
function showWordbook(){
  document.getElementById('wordbook').classList.add('show');
  const grid=document.getElementById('wb-grid');grid.innerHTML='';
  const allFlat=[];
  Object.entries(ALL_WORDS).forEach(([k,words])=>{
    words.forEach(wd=>{allFlat.push({key:k+':'+wd.w,...wd,learned:learnedWords.includes(k+':'+wd.w)});});
  });
  allFlat.forEach(wd=>{
    const d=document.createElement('div');d.className='wb-word'+(wd.learned?' learned':'');
    d.innerHTML='<div class="wb-icon">'+wd.icon+'</div><div class="wb-en">'+wd.w+'</div><div class="wb-zh">'+wd.a+(wd.learned?' ✅':'')+'</div>';
    d.onclick=()=>speak(wd.w,0.7);
    grid.appendChild(d);
  });
}
function closeWordbook(){document.getElementById('wordbook').classList.remove('show');}

// ===== MOBILE INPUT =====
window.addEventListener('keydown',e=>{keys[e.key]=true;if(scene==='playing'||scene==='dead'||scene==='win')e.preventDefault();});
window.addEventListener('keyup',e=>{keys[e.key]=false;});

// Virtual joystick
(function(){
  const base=document.getElementById('joy-base'),stick=document.getElementById('joy-stick');
  let active=false,pid=null,cx=0,cy=0,maxR=0;
  function reset(){active=false;pid=null;stick.style.transform='translate(-50%,-50%)';keys['ArrowLeft']=keys['ArrowRight']=keys[' ']=keys['ArrowUp']=false;}
  function update(ex,ey){
    const dx=ex-cx,dy=ey-cy,dist=Math.sqrt(dx*dx+dy*dy),r=maxR*0.85;
    const sx=dist>r?dx/dist*r:dx,sy=dist>r?dy/dist*r:dy;
    stick.style.transform=`translate(calc(-50% + ${sx}px), calc(-50% + ${sy}px))`;
    const dz=r*0.2;
    keys['ArrowRight']=dx>dz;keys['ArrowLeft']=dx<-dz;
    if(dx>-dz&&dx<dz){keys['ArrowLeft']=keys['ArrowRight']=false;}
    keys[' ']=keys['ArrowUp']=dy<-dz*2.2;
  }
  base.addEventListener('pointerdown',e=>{e.preventDefault();active=true;pid=e.pointerId;const r=base.getBoundingClientRect();cx=r.left+r.width/2;cy=r.top+r.height/2;maxR=r.width/2;update(e.clientX,e.clientY);base.setPointerCapture(e.pointerId);});
  base.addEventListener('pointermove',e=>{if(active&&e.pointerId===pid)update(e.clientX,e.clientY);});
  base.addEventListener('pointerup',e=>{if(e.pointerId===pid)reset();});
  base.addEventListener('pointercancel',reset);
  document.getElementById('joy-jump').addEventListener('pointerdown',e=>{e.preventDefault();keys[' ']=true;keys['ArrowUp']=true;});
  document.getElementById('joy-jump').addEventListener('pointerup',e=>{keys[' ']=false;keys['ArrowUp']=false;});
})();

// ===== UI =====
function updateUI(){
  if(scene!=='playing'&&scene!=='quiz'){
    document.getElementById('ui-bar').classList.remove('show');
    document.getElementById('pause-btn').classList.remove('show');
    return;
  }
  document.getElementById('ui-bar').classList.add('show');
  document.getElementById('pause-btn').classList.add('show');
  document.getElementById('coin-display').textContent=coins;
  document.getElementById('level-display').textContent='W'+curLevel.world+' L'+curLevel.level;
  const t=Math.floor(time);document.getElementById('time-display').textContent=Math.floor(t/60)+':'+String(t%60).padStart(2,'0');
  document.getElementById('lives-display').innerHTML=Array(Math.max(1,lives)).fill('<span style="color:#E53935;margin:0 1px">❤️</span>').join('');
}

// ===== LOOP =====
function loop(){
  if(scene==='playing'&&!paused){time=frame/60;updatePhysics();}
  if(scene==='dead'&&(keys[' ']||keys['Enter']))resetLevel();
  updateUI();render();frame++;requestAnimationFrame(loop);
}
loop();

// Register service worker for PWA
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}

function resize(){
  const ctr=document.getElementById('container');
  if(window.innerWidth<980){
    const land=window.innerWidth>window.innerHeight;
    if(land){
      const h=window.innerHeight-8;
      const w=Math.min(window.innerWidth-16,h*16/9);
      ctr.style.width=w+'px';ctr.style.height=h+'px';
    }else{
      ctr.style.width=window.innerWidth+'px';
      ctr.style.height=Math.min(window.innerWidth*0.5625,window.innerHeight-8)+'px';
    }
  }else{ctr.style.width='960px';ctr.style.height='540px';}
  canvas.style.width=ctr.clientWidth+'px';canvas.style.height=ctr.clientHeight+'px';
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,100));
resize();
</script>
