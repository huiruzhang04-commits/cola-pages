  const articles = ARTICLES.filter(a => a.category === catId);
  const list = document.getElementById('cat-article-list');
  list.innerHTML = `<h3 style="margin-bottom:8px;font-size:16px">${cat.icon} ${cat.name}</h3>` +
    articles.map(a => `
      <div class="article-list-item" onclick="openArticle('${a.id}')">
        <div class="item-info">
          <div class="item-title">${a.title}</div>
          <div class="item-author">${a.author}</div>
          <div class="item-meta">
            <span class="item-stars">${'⭐'.repeat(a.difficulty)}</span>
            <span class="item-duration">⏱ ${a.duration}分钟</span>
          </div>
        </div>
        <span class="item-arrow">›</span>
      </div>
    `).join('');
}

// ==================== RENDER FAVORITES ====================
function renderFavorites() {
  const favs = getFavoriteIds();
  const container = document.getElementById('fav-content');
  if (favs.length === 0) {
    container.innerHTML = `<div class="empty-state">
      <div class="empty-icon">⭐</div>
      <div class="empty-text">还没有收藏，去发现好文章吧</div>
    </div>`;
  } else {
    container.innerHTML = `<div class="fav-grid">` +
      favs.map(id => {
        const a = ARTICLES.find(ar => ar.id === id);
        if (!a) return '';
        const cat = CATEGORIES.find(c => c.id === a.category);
        return `<div class="fav-card" onclick="openArticle('${a.id}')">
          <div class="fav-title">${a.title}</div>
          <div class="fav-author">${a.author}</div>
          <div class="fav-cat"><span class="cat-badge" style="background:${cat.color};color:#fff;font-size:9px">${cat.icon} ${cat.name}</span></div>
        </div>`;
      }).join('') +
    `</div>`;
  }
}

// ==================== RENDER PROFILE ====================
function renderProfile() {
  const streak = calcStreak();
  const recitedIds = getRecitedIds();
  const totalMin = recitedIds.reduce((sum, id) => { const a = ARTICLES.find(ar => ar.id === id); return sum + (a ? a.duration : 0); }, 0);

  document.getElementById('stats-row').innerHTML = `
    <div class="stat-card"><div class="stat-value">${recitedIds.length}</div><div class="stat-label">已背诵</div></div>
    <div class="stat-card"><div class="stat-value">${streak}</div><div class="stat-label">连续天数</div></div>
    <div class="stat-card"><div class="stat-value">${totalMin}</div><div class="stat-label">总分钟</div></div>
  `;

  renderCalendar();

  document.getElementById('dark-mode-checkbox').checked = getNightMode();
}

let calendarMonth = new Date().getMonth();
let calendarYear = new Date().getFullYear();

function renderCalendar() {
  const container = document.getElementById('calendar-container');
  const recitedDates = getRecitedDates();
  const today = formatDate(new Date());

  const monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  const dayHeaders = ['日','一','二','三','四','五','六'];

  const firstDay = new Date(calendarYear, calendarMonth, 1).getDay();
  const daysInMonth = new Date(calendarYear, calendarMonth+1, 0).getDate();
  const daysInPrevMonth = new Date(calendarYear, calendarMonth, 0).getDate();

  let cells = '';
  // Previous month
  for (let i = firstDay - 1; i >= 0; i--) {
    cells += `<div class="day-cell other-month">${daysInPrevMonth - i}</div>`;
  }
  // Current month
  for (let d = 1; d <= daysInMonth; d++) {
    const ds = `${calendarYear}-${String(calendarMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = ds === today;
    const isRecited = !!recitedDates[ds];
    cells += `<div class="day-cell${isToday?' today':''}${isRecited?' recited':''}">${d}</div>`;
  }
  // Next month
  const totalCells = firstDay + daysInMonth;
  const remaining = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
  for (let d = 1; d <= remaining; d++) {
    cells += `<div class="day-cell other-month">${d}</div>`;
  }

  container.innerHTML = `
    <div class="calendar-header">
      <span class="month-label">${calendarYear}年 ${monthNames[calendarMonth]}</span>
      <div class="month-nav">
        <button id="cal-prev">◀</button>
        <button id="cal-next">▶</button>
      </div>
    </div>
    <div class="calendar-grid">
      ${dayHeaders.map(h => `<div class="day-header">${h}</div>`).join('')}
      ${cells}
    </div>
  `;

  document.getElementById('cal-prev').addEventListener('click', () => {
    if (calendarMonth === 0) { calendarMonth = 11; calendarYear--; }
    else calendarMonth--;
    renderCalendar();
  });
  document.getElementById('cal-next').addEventListener('click', () => {
    if (calendarMonth === 11) { calendarMonth = 0; calendarYear++; }
    else calendarMonth++;
    renderCalendar();
  });
}

// ==================== QUICK TRANSLATE ====================
function doQuickTranslate() {
  const input = document.getElementById('translate-input').value.trim();
  if (!input) return;
  const words = input.split(/\s+/);
  const result = document.getElementById('translate-result');
  let found = 0;
  let rows = '';
  words.forEach(w => {
    const clean = w.replace(/[^a-zA-Z'-]/g, '');
    if (!clean) return;
    const def = dictLookup(clean);
    if (def) { rows += `<tr><td class="word-col">${clean}</td><td class="def-col">${def}</td></tr>`; found++; }
    else { rows += `<tr><td class="word-col">${clean}</td><td class="def-col" style="color:var(--text-muted)">—</td></tr>`; }
  });
  result.innerHTML = `
    <div class="src-text">📝 ${input}</div>
    ${found > 0 ? `<table>${rows}</table>` : '<p style="color:var(--text-muted);font-size:13px">未找到匹配词汇，试试更常见的单词</p>'}
    <button class="save-card-btn" id="save-translate-card-btn">📌 加入我的卡片</button>
  `;
  document.getElementById('save-translate-card-btn').addEventListener('click', () => {
    const cards = getCustomCards();
    cards.push({text:input, date:formatDate(new Date())});
    setCustomCards(cards);
    showToast('已加入卡片 📌');
  });
}

// ==================== DARK MODE ====================
function applyDarkMode() {
  if (getNightMode()) document.body.classList.add('dark');
  else document.body.classList.remove('dark');
}

function toggleDarkMode() {
  setNightMode(!getNightMode());
  applyDarkMode();
}

// ==================== INIT ====================
function init() {
  // Dark mode
  if (localStorage.getItem('night_mode') === null) {
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    setNightMode(prefersDark);
  }
  applyDarkMode();

  renderHome();
  renderCategories();
  renderFavorites();
  renderProfile();

  // Bottom nav
  document.querySelectorAll('#bottom-nav .nav-btn').forEach(btn => {
    btn.addEventListener('click', () => switchTab(btn.dataset.tab));
  });

  // Category back
  document.getElementById('cat-back-btn').addEventListener('click', () => {
    currentCategory = null;
    document.getElementById('cat-grid-view').style.display = 'block';
    document.getElementById('cat-list-view').style.display = 'none';
  });

  // Detail actions
  document.getElementById('btn-tts').addEventListener('click', toggleTTS);
  document.getElementById('btn-fav').addEventListener('click', toggleFavorite);
  document.getElementById('btn-recited').addEventListener('click', markRecited);
  document.getElementById('btn-share').addEventListener('click', generateShareCard);

  // Share modal
  document.getElementById('share-save-btn').addEventListener('click', saveShareCard);
  document.getElementById('share-close-btn').addEventListener('click', () => {
    document.getElementById('share-modal').classList.remove('active');
  });

  // FAB
  document.getElementById('fab-btn').addEventListener('click', () => {
    document.getElementById('translate-panel').classList.add('active');
  });

  // Translate panel
  document.getElementById('translate-close-btn').addEventListener('click', () => {
    document.getElementById('translate-panel').classList.remove('active');
  });
  document.getElementById('translate-do-btn').addEventListener('click', doQuickTranslate);

  // Dark mode toggle
  document.getElementById('dark-mode-checkbox').addEventListener('change', toggleDarkMode);
  document.getElementById('dark-mode-toggle-item').addEventListener('click', function(e) {
    if (e.target.tagName === 'INPUT') return;
    const cb = document.getElementById('dark-mode-checkbox');
    cb.checked = !cb.checked;
    toggleDarkMode();
  });

  // Close detail on overlay click
  document.getElementById('detail-overlay').addEventListener('click', function(e) {
    if (e.target === this) closeDetail();
  });

  // Close translate panel on overlay click
  document.getElementById('translate-panel').addEventListener('click', function(e) {
    if (e.target === this) {
      document.getElementById('translate-panel').classList.remove('active');
    }
  });

  // Keyboard escape
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      if (document.getElementById('detail-overlay').classList.contains('active')) closeDetail();
      if (document.getElementById('share-modal').classList.contains('active')) document.getElementById('share-modal').classList.remove('active');
      if (document.getElementById('translate-panel').classList.contains('active')) document.getElementById('translate-panel').classList.remove('active');
    }
  });

  // System dark mode change
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
    if (localStorage.getItem('night_mode') === null) {
      setNightMode(e.matches);
      applyDarkMode();
    }
  });

  // Voice support check
  if (!('speechSynthesis' in window)) {
    document.getElementById('btn-tts').style.opacity = '0.5';
    document.getElementById('btn-tts').title = '浏览器不支持语音朗读';
  }
}

document.addEventListener('DOMContentLoaded', init);
</script>
